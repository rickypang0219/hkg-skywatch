[package]
name = "hkg-skywatch"
version = "0.2.0"
edition = "2021"
default-run = "hkg-skywatch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "=0.4.54"
js-sys = "=0.3.81"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "=0.3.81", features = ["Window", "Document", "Element", "HtmlInputElement", "Event", "EventTarget", "CustomEvent", "Url", "console"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
